services:
  mysql:
    image: mysql:8.4
    container_name: nexus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexus_db
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_password
    ports:
      - "3307:3306"
    volumes:
      - nexus_mysql_data:/var/lib/mysql

volumes:
  nexus_mysql_data: